apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.watnapp.etipitaka.plus'
    compileSdk 37
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.watnapp.etipitaka.plus"
        minSdk 21
        targetSdk 37
        versionCode 3038
        versionName "2.5.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "int", "MIN_SDK", "21"
        buildConfigField "int", "TARGET_SDK", "37"
        buildConfigField "int", "COMPILE_SDK", "37"
    }

    buildFeatures {
        viewBinding = true
        compose = true
        buildConfig = true
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey("storeFile")) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation libs.commons.lang3
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.viewpager2
    implementation libs.slidingmenu
    implementation libs.stickylistheaders
    
    implementation libs.dart.annotations
    implementation libs.dart
    implementation libs.henson
    implementation libs.bolts.tasks
    implementation libs.bolts.applinks
    implementation libs.ion
    implementation libs.sqliteassethelper
    implementation libs.koin.core
    implementation libs.koin.android
    implementation libs.androidx.core.ktx
    implementation libs.guava
    implementation libs.kotlinx.coroutines.core
    implementation libs.okhttp
    implementation libs.androidx.lifecycle.livedata.core.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.commons.io
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3

    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    annotationProcessor libs.dart.processor
    annotationProcessor libs.henson.processor

    testImplementation libs.junit
    testImplementation libs.org.json
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.compose.ui.test.junit4
}
